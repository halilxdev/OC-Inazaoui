name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  CI:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - name: Vérification du code
        uses: actions/checkout@v4
      
      - name: Configuration PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_pgsql
          coverage: xdebug
      
      - name: Installation des dépendances
        run: composer install --prefer-dist --no-progress
      
      - name: Configuration de la base de données en PostgreSQL
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_db?serverVersion=16&charset=utf8
      
      - name: Lancement des tests PHPUnit
        run: php bin/phpunit --coverage-text
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_db?serverVersion=16&charset=utf8
      
      - name: Analyse statique PHPStan
        run: vendor/bin/phpstan analyse src --level=5
      
      - name: Analyse performance sur la page invités
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🚀  RAPPORT DE PERFORMANCE — $(date '+%d/%m/%Y %H:%M:%S')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          RESULT=$(ab -n 100 -c 10 -b  https://localhost:8000/guests)

          RPS=$(echo "$RESULT"       | grep "Requests per second" | awk '{print $4}')
          MEAN=$(echo "$RESULT"      | grep "Time per request"    | head -1 | awk '{print $4}')
          MEDIAN=$(echo "$RESULT"    | grep " 50%"                | awk '{print $2}')
          P95=$(echo "$RESULT"       | grep " 95%"                | awk '{print $2}')
          P99=$(echo "$RESULT"       | grep " 99%"                | awk '{print $2}')
          FAILED=$(echo "$RESULT"    | grep "Failed requests"     | awk '{print $3}')

          echo "  📄 Page testée     : /guests"
          echo "  🔁 Requêtes        : 100  |  Concurrence : 10"
          echo ""
          echo "  ⚡ Débit           : ${RPS} req/sec"
          echo "  ⏱️  Temps moyen     : ${MEAN} ms"
          echo "  📈 Médiane (p50)   : ${MEDIAN} ms"
          echo "  📈 Percentile p95  : ${P95} ms"
          echo "  📈 Percentile p99  : ${P99} ms"
          echo "  ❌ Requêtes KO     : ${FAILED}"
          echo ""

          # Seuil d'alerte : temps moyen > 500ms = fail
          MEAN_INT=$(echo "$MEAN" | cut -d. -f1)
          if [ "$MEAN_INT" -gt 500 ]; then
            echo "  ⚠️  ALERTE : temps moyen (${MEAN}ms) dépasse le seuil de 500ms !"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          else
            echo "  ✅ Performance OK (seuil : 500ms)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          fi